<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benton County GIS Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 600px;
        }
        .sidebar {
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .feature-info {
            margin-top: 15px;
            padding: 15px;
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            display: none;
        }
        .controls {
            margin-bottom: 15px;
            padding: 10px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Benton County GIS</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-9">
                <div class="controls">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="parcelLayer" checked>
                        <label class="form-check-label" for="parcelLayer">Parcels</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="zoningLayer" checked>
                        <label class="form-check-label" for="zoningLayer">Zoning</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="roadLayer" checked>
                        <label class="form-check-label" for="roadLayer">Roads</label>
                    </div>
                </div>
                <div id="map"></div>
                <div class="feature-info" id="featureInfo">
                    <h5 id="featureTitle">Feature Information</h5>
                    <div id="featureProperties"></div>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="sidebar">
                    <h5>Benton County GIS</h5>
                    <p>Access Benton County parcel data and related information.</p>
                    
                    <div class="mb-3">
                        <label for="parcelSearch" class="form-label">Search Parcel</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="parcelSearch" placeholder="Enter parcel number">
                            <button class="btn btn-outline-secondary" type="button" id="searchButton">Search</button>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <h6>Quick Access</h6>
                        <div class="list-group">
                            <button type="button" class="list-group-item list-group-item-action" data-type="residential">Residential Zones</button>
                            <button type="button" class="list-group-item list-group-item-action" data-type="commercial">Commercial Zones</button>
                            <button type="button" class="list-group-item list-group-item-action" data-type="recent">Recently Updated Parcels</button>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="apiToken" class="form-label">API Token (Required for live data)</label>
                        <input type="password" class="form-control" id="apiToken">
                        <button class="btn btn-primary mt-2" id="saveToken">Save Token</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <script>
        // Initialize the map
        mapboxgl.accessToken = 'pk.eyJ1IjoiZGVtby1hY2NvdW50IiwiYSI6ImNrbmhyeTBtMzBpMWoydm8waW9uaG5wOXkifQ.dlJf2e-YK1psIJ_awCIxXw';
        
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v11',
            center: [-119.2290, 46.2503], // Benton County, WA
            zoom: 10
        });
        
        map.addControl(new mapboxgl.NavigationControl());
        
        // Add live Benton County GIS data when map loads
        map.on('load', function() {
            // Check if API token is stored
            const storedToken = localStorage.getItem('bentonApiToken');
            if (storedToken) {
                document.getElementById('apiToken').value = storedToken;
                loadBentonCountyData(storedToken);
            } else {
                showTokenPrompt();
            }
            
            // Layer toggle controls
            document.getElementById('parcelLayer').addEventListener('change', function(e) {
                const visibility = e.target.checked ? 'visible' : 'none';
                if (map.getLayer('parcels-fill')) {
                    map.setLayoutProperty('parcels-fill', 'visibility', visibility);
                    map.setLayoutProperty('parcels-outline', 'visibility', visibility);
                }
            });
            
            document.getElementById('zoningLayer').addEventListener('change', function(e) {
                const visibility = e.target.checked ? 'visible' : 'none';
                if (map.getLayer('zoning-fill')) {
                    map.setLayoutProperty('zoning-fill', 'visibility', visibility);
                }
            });
            
            document.getElementById('roadLayer').addEventListener('change', function(e) {
                const visibility = e.target.checked ? 'visible' : 'none';
                if (map.getLayer('roads')) {
                    map.setLayoutProperty('roads', 'visibility', visibility);
                }
            });
            
            // Token saving
            document.getElementById('saveToken').addEventListener('click', function() {
                const token = document.getElementById('apiToken').value;
                if (token) {
                    localStorage.setItem('bentonApiToken', token);
                    loadBentonCountyData(token);
                } else {
                    alert('Please enter a valid API token');
                }
            });
            
            // Quick access buttons
            document.querySelectorAll('.list-group-item').forEach(button => {
                button.addEventListener('click', function() {
                    const type = this.getAttribute('data-type');
                    filterByType(type);
                });
            });
            
            // Search functionality
            document.getElementById('searchButton').addEventListener('click', function() {
                searchParcel();
            });
            
            document.getElementById('parcelSearch').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchParcel();
                }
            });
        });
        
        function showTokenPrompt() {
            // Show an overlay on the map prompting for token
            const mapContainer = document.getElementById('map');
            const tokenPrompt = document.createElement('div');
            tokenPrompt.className = 'token-prompt';
            tokenPrompt.style.position = 'absolute';
            tokenPrompt.style.top = '0';
            tokenPrompt.style.left = '0';
            tokenPrompt.style.width = '100%';
            tokenPrompt.style.height = '100%';
            tokenPrompt.style.backgroundColor = 'rgba(255,255,255,0.9)';
            tokenPrompt.style.display = 'flex';
            tokenPrompt.style.alignItems = 'center';
            tokenPrompt.style.justifyContent = 'center';
            tokenPrompt.style.flexDirection = 'column';
            tokenPrompt.style.padding = '20px';
            tokenPrompt.style.textAlign = 'center';
            
            tokenPrompt.innerHTML = `
                <h4>API Token Required</h4>
                <p>Please enter your Benton County GIS API token in the sidebar to load the map.</p>
            `;
            
            mapContainer.style.position = 'relative';
            mapContainer.appendChild(tokenPrompt);
        }
        
        function loadBentonCountyData(token) {
            // Remove token prompt if exists
            const tokenPrompt = document.querySelector('.token-prompt');
            if (tokenPrompt) {
                tokenPrompt.remove();
            }
            
            // In a real application, this would make an API request with the token
            // For now, we'll add a simulated GeoJSON layer
            
            // Add parcel layer
            if (!map.getSource('parcels')) {
                map.addSource('parcels', {
                    type: 'geojson',
                    data: {
                        type: 'FeatureCollection',
                        features: [
                            // Sample Benton County parcels
                            {
                                type: 'Feature',
                                properties: {
                                    PARCEL_NUM: '12345-000',
                                    OWNER: 'Smith, John',
                                    ACRES: 5.2,
                                    SITUS: '123 Main St, Richland, WA'
                                },
                                geometry: {
                                    type: 'Polygon',
                                    coordinates: [[
                                        [-119.2290, 46.2503],
                                        [-119.2270, 46.2503],
                                        [-119.2270, 46.2483],
                                        [-119.2290, 46.2483],
                                        [-119.2290, 46.2503]
                                    ]]
                                }
                            },
                            {
                                type: 'Feature',
                                properties: {
                                    PARCEL_NUM: '23456-000',
                                    OWNER: 'Johnson, Mary',
                                    ACRES: 2.8,
                                    SITUS: '456 Oak St, Kennewick, WA'
                                },
                                geometry: {
                                    type: 'Polygon',
                                    coordinates: [[
                                        [-119.2190, 46.2403],
                                        [-119.2170, 46.2403],
                                        [-119.2170, 46.2383],
                                        [-119.2190, 46.2383],
                                        [-119.2190, 46.2403]
                                    ]]
                                }
                            }
                        ]
                    }
                });
                
                map.addLayer({
                    id: 'parcels-fill',
                    type: 'fill',
                    source: 'parcels',
                    paint: {
                        'fill-color': 'rgba(0, 128, 255, 0.2)',
                        'fill-outline-color': 'rgba(0, 128, 255, 1)'
                    }
                });
                
                map.addLayer({
                    id: 'parcels-outline',
                    type: 'line',
                    source: 'parcels',
                    paint: {
                        'line-color': 'rgba(0, 128, 255, 1)',
                        'line-width': 1
                    }
                });
                
                // Add click event for parcels
                map.on('click', 'parcels-fill', function(e) {
                    if (!e.features || e.features.length === 0) return;
                    
                    const feature = e.features[0];
                    const properties = feature.properties;
                    
                    // Display feature information
                    showFeatureInfo(properties);
                });
            }
            
            // Add zoning layer
            if (!map.getSource('zoning')) {
                map.addSource('zoning', {
                    type: 'geojson',
                    data: {
                        type: 'FeatureCollection',
                        features: [
                            // Sample zoning areas
                            {
                                type: 'Feature',
                                properties: {
                                    ZONE_CODE: 'R-1',
                                    ZONE_TYPE: 'Residential',
                                    DESCRIPTION: 'Single-family residential'
                                },
                                geometry: {
                                    type: 'Polygon',
                                    coordinates: [[
                                        [-119.2390, 46.2603],
                                        [-119.2350, 46.2603],
                                        [-119.2350, 46.2553],
                                        [-119.2390, 46.2553],
                                        [-119.2390, 46.2603]
                                    ]]
                                }
                            },
                            {
                                type: 'Feature',
                                properties: {
                                    ZONE_CODE: 'C-1',
                                    ZONE_TYPE: 'Commercial',
                                    DESCRIPTION: 'General commercial'
                                },
                                geometry: {
                                    type: 'Polygon',
                                    coordinates: [[
                                        [-119.2190, 46.2603],
                                        [-119.2150, 46.2603],
                                        [-119.2150, 46.2553],
                                        [-119.2190, 46.2553],
                                        [-119.2190, 46.2603]
                                    ]]
                                }
                            }
                        ]
                    }
                });
                
                map.addLayer({
                    id: 'zoning-fill',
                    type: 'fill',
                    source: 'zoning',
                    paint: {
                        'fill-color': [
                            'match',
                            ['get', 'ZONE_TYPE'],
                            'Residential', 'rgba(255, 128, 0, 0.2)',
                            'Commercial', 'rgba(255, 0, 0, 0.2)',
                            'Industrial', 'rgba(128, 0, 128, 0.2)',
                            'Agricultural', 'rgba(0, 128, 0, 0.2)',
                            'rgba(100, 100, 100, 0.2)' // Default
                        ],
                        'fill-outline-color': 'rgba(0, 0, 0, 0.5)'
                    },
                    layout: {
                        'visibility': 'visible'
                    }
                });
                
                // Add click event for zoning
                map.on('click', 'zoning-fill', function(e) {
                    if (!e.features || e.features.length === 0) return;
                    
                    const feature = e.features[0];
                    const properties = feature.properties;
                    
                    // Display feature information
                    showFeatureInfo(properties);
                });
            }
            
            // Add roads layer
            if (!map.getSource('roads')) {
                map.addSource('roads', {
                    type: 'geojson',
                    data: {
                        type: 'FeatureCollection',
                        features: [
                            // Sample roads
                            {
                                type: 'Feature',
                                properties: {
                                    NAME: 'Main Street',
                                    ROAD_TYPE: 'Minor'
                                },
                                geometry: {
                                    type: 'LineString',
                                    coordinates: [
                                        [-119.2290, 46.2503],
                                        [-119.2190, 46.2503]
                                    ]
                                }
                            },
                            {
                                type: 'Feature',
                                properties: {
                                    NAME: 'Broadway Avenue',
                                    ROAD_TYPE: 'Major'
                                },
                                geometry: {
                                    type: 'LineString',
                                    coordinates: [
                                        [-119.2290, 46.2403],
                                        [-119.2190, 46.2403]
                                    ]
                                }
                            }
                        ]
                    }
                });
                
                map.addLayer({
                    id: 'roads',
                    type: 'line',
                    source: 'roads',
                    paint: {
                        'line-color': 'rgba(128, 128, 128, 0.8)',
                        'line-width': [
                            'match',
                            ['get', 'ROAD_TYPE'],
                            'Highway', 4,
                            'Major', 3,
                            'Minor', 2,
                            1.5 // Default
                        ]
                    },
                    layout: {
                        'visibility': 'visible'
                    }
                });
            }
        }
        
        function showFeatureInfo(properties) {
            const featureInfo = document.getElementById('featureInfo');
            const featureProperties = document.getElementById('featureProperties');
            
            // Clear previous content
            featureProperties.innerHTML = '';
            
            // Set feature title
            if (properties.PARCEL_NUM) {
                document.getElementById('featureTitle').textContent = `Parcel #${properties.PARCEL_NUM}`;
            } else if (properties.ZONE_CODE) {
                document.getElementById('featureTitle').textContent = `${properties.ZONE_TYPE} Zone (${properties.ZONE_CODE})`;
            } else if (properties.NAME) {
                document.getElementById('featureTitle').textContent = properties.NAME;
            } else {
                document.getElementById('featureTitle').textContent = 'Feature Information';
            }
            
            // Add each property to the table
            const table = document.createElement('table');
            table.className = 'table table-sm';
            
            const tbody = document.createElement('tbody');
            for (const [key, value] of Object.entries(properties)) {
                if (value !== null && value !== undefined && value !== '') {
                    const row = document.createElement('tr');
                    
                    const keyCell = document.createElement('td');
                    keyCell.style.fontWeight = '500';
                    keyCell.textContent = key.replace(/_/g, ' ');
                    
                    const valueCell = document.createElement('td');
                    valueCell.textContent = value;
                    
                    row.appendChild(keyCell);
                    row.appendChild(valueCell);
                    tbody.appendChild(row);
                }
            }
            
            table.appendChild(tbody);
            featureProperties.appendChild(table);
            
            // Show the feature info panel
            featureInfo.style.display = 'block';
        }
        
        function searchParcel() {
            const parcelNumber = document.getElementById('parcelSearch').value.trim();
            if (!parcelNumber) {
                alert('Please enter a parcel number to search');
                return;
            }
            
            // Filter the map to show only this parcel
            map.setFilter('parcels-fill', ['==', 'PARCEL_NUM', parcelNumber]);
            map.setFilter('parcels-outline', ['==', 'PARCEL_NUM', parcelNumber]);
            
            // Find the feature to zoom to
            const features = map.querySourceFeatures('parcels', {
                filter: ['==', 'PARCEL_NUM', parcelNumber]
            });
            
            if (features.length > 0) {
                // Get bounds of the feature
                const coordinates = features[0].geometry.coordinates[0];
                const bounds = coordinates.reduce((bounds, coord) => {
                    return bounds.extend(coord);
                }, new mapboxgl.LngLatBounds(coordinates[0], coordinates[0]));
                
                // Zoom to feature
                map.fitBounds(bounds, {
                    padding: 50
                });
                
                // Show feature info
                showFeatureInfo(features[0].properties);
            } else {
                alert('Parcel not found. Please check the parcel number.');
                
                // Reset filters
                map.setFilter('parcels-fill', null);
                map.setFilter('parcels-outline', null);
            }
        }
        
        function filterByType(type) {
            switch(type) {
                case 'residential':
                    // Filter to show only residential zones
                    map.setFilter('zoning-fill', ['==', 'ZONE_TYPE', 'Residential']);
                    break;
                case 'commercial':
                    // Filter to show only commercial zones
                    map.setFilter('zoning-fill', ['==', 'ZONE_TYPE', 'Commercial']);
                    break;
                case 'recent':
                    // This would require actual data with updated timestamps
                    alert('This feature requires connection to live Benton County data.');
                    // Reset filters
                    map.setFilter('parcels-fill', null);
                    map.setFilter('parcels-outline', null);
                    map.setFilter('zoning-fill', null);
                    break;
                default:
                    // Reset all filters
                    map.setFilter('parcels-fill', null);
                    map.setFilter('parcels-outline', null);
                    map.setFilter('zoning-fill', null);
            }
        }
    </script>
</body>
</html>
