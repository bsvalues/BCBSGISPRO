<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benton County GIS Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }
    #map {
      width: 100%;
      height: 100vh;
      z-index: 1;
    }
    .title-bar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 10px 20px;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      text-align: center;
    }
    .title-bar h1 {
      margin: 0;
      font-size: 20px;
      color: #333;
    }
    .info-panel {
      position: absolute;
      top: 60px;
      right: 10px;
      background: white;
      padding: 10px;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      max-width: 300px;
    }
    .info-panel h2 {
      margin-top: 0;
      font-size: 16px;
    }
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .loading-content {
      background: white;
      padding: 20px;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 2s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  
  <div class="title-bar">
    <h1>Benton County GIS Parcel Viewer</h1>
  </div>
  
  <div class="info-panel">
    <h2>About This Map</h2>
    <p>This map displays real parcel data from Benton County's ArcGIS server.</p>
    <p><strong>Instructions:</strong></p>
    <ul>
      <li>Click on a parcel to view its details</li>
      <li>Hover over parcels to highlight them</li>
      <li>Use the mouse wheel to zoom in/out</li>
    </ul>
  </div>
  
  <div id="loading" class="loading">
    <div class="loading-content">
      <div class="spinner"></div>
      <p>Loading Benton County parcel data...</p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Wait for document to load
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize map centered on Benton County
      const map = L.map('map').setView([46.2503, -119.2290], 12);
      
      // Add OpenStreetMap base layer
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);
      
      // Create loading indicator
      const loading = document.getElementById('loading');
      
      // Function to style parcels
      function styleParcel(feature) {
        return {
          fillColor: '#3388ff',
          weight: 1,
          opacity: 1,
          color: '#666',
          fillOpacity: 0.2
        };
      }
      
      // Function to handle parcel interactions
      function onEachParcel(feature, layer) {
        if (feature.properties) {
          // Create popup content
          const props = feature.properties;
          let popupContent = '<div style="max-width: 250px;">';
          
          if (props.PARCELNBR) {
            popupContent += `<h3 style="margin: 0 0 8px 0; border-bottom: 1px solid #eee; padding-bottom: 5px;">Parcel: ${props.PARCELNBR}</h3>`;
          }
          
          if (props.OWNER_NAME) {
            popupContent += `<p style="margin: 0 0 4px 0;"><strong>Owner:</strong> ${props.OWNER_NAME}</p>`;
          }
          
          if (props.FULLADDRESS) {
            popupContent += `<p style="margin: 0 0 4px 0;"><strong>Address:</strong> ${props.FULLADDRESS}</p>`;
          }
          
          if (props.ACRES) {
            popupContent += `<p style="margin: 0 0 4px 0;"><strong>Acres:</strong> ${parseFloat(props.ACRES).toFixed(2)}</p>`;
          }
          
          popupContent += '</div>';
          
          // Bind popup to layer
          layer.bindPopup(popupContent);
          
          // Add hover effects
          layer.on({
            mouseover: function(e) {
              const layer = e.target;
              layer.setStyle({
                fillOpacity: 0.6,
                fillColor: '#10b981'
              });
            },
            mouseout: function(e) {
              const layer = e.target;
              layer.setStyle(styleParcel(feature));
            }
          });
        }
      }
      
      // Fetch parcel data from Benton County ArcGIS REST service
      fetch('https://services7.arcgis.com/NURlY7V8UHl6XumF/ArcGIS/rest/services/Parcels_and_Assess/FeatureServer/0/query?where=1%3D1&outFields=PARCELNBR,OWNER_NAME,FULLADDRESS,ACRES&geometry=-119.3590,46.1503,-119.0990,46.3503&geometryType=esriGeometryEnvelope&spatialRel=esriSpatialRelIntersects&resultRecordCount=100&outSR=4326&f=geojson')
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok');
          }
          return response.json();
        })
        .then(data => {
          // Add GeoJSON data to map
          const parcelsLayer = L.geoJSON(data, {
            style: styleParcel,
            onEachFeature: onEachParcel
          }).addTo(map);
          
          // Fit map to parcel bounds
          map.fitBounds(parcelsLayer.getBounds());
          
          // Hide loading indicator
          loading.style.display = 'none';
        })
        .catch(error => {
          console.error('Error fetching parcel data:', error);
          loading.innerHTML = `
            <div class="loading-content">
              <p style="color: #e74c3c; font-weight: bold;">Error loading data</p>
              <p>${error.message}</p>
              <button onclick="window.location.reload()" style="padding: 8px 16px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;">Try Again</button>
            </div>
          `;
        });
    });
  </script>
</body>
</html>
