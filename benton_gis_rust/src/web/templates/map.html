{% extends "base.html" %}

{% block title %}Interactive Map - TerraFusion Platform{% endblock %}

{% block head %}
<!-- MapBox and related mapping libraries -->
<link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet">
<link rel="stylesheet" href="/css/map.css">
{% endblock %}

{% block content %}
<section class="map-container">
    <div class="map-header">
        <h1>Benton County GIS</h1>
        <div class="map-controls">
            <div class="layer-toggle">
                <label>
                    <input type="checkbox" id="parcels-layer" checked>
                    Parcels
                </label>
                <label>
                    <input type="checkbox" id="zoning-layer" checked>
                    Zoning
                </label>
                <label>
                    <input type="checkbox" id="roads-layer" checked>
                    Roads
                </label>
            </div>
        </div>
    </div>
    
    <div id="map"></div>
    
    <div class="feature-info-panel" id="feature-info">
        <div class="panel-header">
            <h3>Feature Information</h3>
            <button class="close-btn" id="close-feature-info">&times;</button>
        </div>
        <div class="panel-content">
            <p class="empty-message">Click on a feature to see details</p>
            <div class="feature-details" style="display: none;">
                <h4 id="feature-title">Parcel #12345</h4>
                <div class="property-grid" id="feature-properties">
                    <!-- Properties will be populated dynamically -->
                </div>
                <div class="feature-actions">
                    <button class="btn btn-sm" id="view-documents">Related Documents</button>
                    <button class="btn btn-sm" id="view-workflows">Related Workflows</button>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
<script>
    // Initialize MapBox with the provided token
    mapboxgl.accessToken = '{{ mapbox_token }}';
    
    // Create the map
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/light-v11',
        center: [-119.2290, 46.2503], // Benton County, WA
        zoom: 10
    });
    
    // Add navigation controls
    map.addControl(new mapboxgl.NavigationControl());
    
    // When the map loads, add the data sources and layers
    map.on('load', function() {
        // Load parcel data from our API (real Benton County data)
        fetch('/api/arcgis/parcels')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to load parcel data. Please ensure your ArcGIS token is valid.');
                }
                return response.json();
            })
            .then(data => {
                // Add the data source
                map.addSource('parcels', {
                    type: 'geojson',
                    data: data
                });
                
                // Add the parcel layer
                map.addLayer({
                    id: 'parcels-fill',
                    type: 'fill',
                    source: 'parcels',
                    paint: {
                        'fill-color': 'rgba(0, 128, 255, 0.2)',
                        'fill-outline-color': 'rgba(0, 128, 255, 1)'
                    }
                });
                
                // Add parcel outlines
                map.addLayer({
                    id: 'parcels-outline',
                    type: 'line',
                    source: 'parcels',
                    paint: {
                        'line-color': 'rgba(0, 128, 255, 1)',
                        'line-width': 1
                    }
                });
            })
            .catch(error => {
                console.error('Error loading parcel data:', error);
                // Show error message in the map
                const errorDiv = document.createElement('div');
                errorDiv.className = 'map-error';
                errorDiv.textContent = 'Unable to load real Benton County parcel data. Please check your ArcGIS token.';
                document.getElementById('map').appendChild(errorDiv);
            });
            
        // Load zoning data
        fetch('/api/arcgis/zoning')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to load zoning data');
                }
                return response.json();
            })
            .then(data => {
                // Add the data source
                map.addSource('zoning', {
                    type: 'geojson',
                    data: data
                });
                
                // Add the zoning layer
                map.addLayer({
                    id: 'zoning-fill',
                    type: 'fill',
                    source: 'zoning',
                    paint: {
                        'fill-color': [
                            'match',
                            ['get', 'ZONE_TYPE'],
                            'Residential', 'rgba(255, 128, 0, 0.2)',
                            'Commercial', 'rgba(255, 0, 0, 0.2)',
                            'Industrial', 'rgba(128, 0, 128, 0.2)',
                            'Agricultural', 'rgba(0, 128, 0, 0.2)',
                            'rgba(100, 100, 100, 0.2)' // Default
                        ],
                        'fill-outline-color': 'rgba(0, 0, 0, 0.5)'
                    },
                    layout: {
                        'visibility': 'visible'
                    }
                });
            })
            .catch(error => {
                console.error('Error loading zoning data:', error);
            });
            
        // Load roads data
        fetch('/api/arcgis/roads')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to load roads data');
                }
                return response.json();
            })
            .then(data => {
                // Add the data source
                map.addSource('roads', {
                    type: 'geojson',
                    data: data
                });
                
                // Add the roads layer
                map.addLayer({
                    id: 'roads-line',
                    type: 'line',
                    source: 'roads',
                    paint: {
                        'line-color': 'rgba(128, 128, 128, 0.8)',
                        'line-width': [
                            'match',
                            ['get', 'ROAD_TYPE'],
                            'Highway', 4,
                            'Major', 3,
                            'Minor', 2,
                            1.5 // Default
                        ]
                    },
                    layout: {
                        'visibility': 'visible'
                    }
                });
            })
            .catch(error => {
                console.error('Error loading roads data:', error);
            });
    });
    
    // Handle layer toggling
    document.getElementById('parcels-layer').addEventListener('change', function(e) {
        const visibility = e.target.checked ? 'visible' : 'none';
        map.setLayoutProperty('parcels-fill', 'visibility', visibility);
        map.setLayoutProperty('parcels-outline', 'visibility', visibility);
    });
    
    document.getElementById('zoning-layer').addEventListener('change', function(e) {
        const visibility = e.target.checked ? 'visible' : 'none';
        map.setLayoutProperty('zoning-fill', 'visibility', visibility);
    });
    
    document.getElementById('roads-layer').addEventListener('change', function(e) {
        const visibility = e.target.checked ? 'visible' : 'none';
        map.setLayoutProperty('roads-line', 'visibility', visibility);
    });
    
    // Handle feature selection
    map.on('click', 'parcels-fill', function(e) {
        if (!e.features || e.features.length === 0) return;
        
        const feature = e.features[0];
        const properties = feature.properties;
        
        // Display feature information in the panel
        document.querySelector('#feature-info .empty-message').style.display = 'none';
        document.querySelector('#feature-info .feature-details').style.display = 'block';
        
        // Set the title (parcel number if available)
        document.getElementById('feature-title').textContent = 
            properties.PARCEL_NUM ? `Parcel #${properties.PARCEL_NUM}` : 'Selected Parcel';
        
        // Clear existing properties
        const propertiesContainer = document.getElementById('feature-properties');
        propertiesContainer.innerHTML = '';
        
        // Add each property to the grid
        for (const [key, value] of Object.entries(properties)) {
            if (value !== null && value !== undefined && value !== '') {
                const propertyRow = document.createElement('div');
                propertyRow.className = 'property-row';
                
                const keyElem = document.createElement('span');
                keyElem.className = 'property-key';
                keyElem.textContent = key.replace(/_/g, ' ');
                
                const valueElem = document.createElement('span');
                valueElem.className = 'property-value';
                valueElem.textContent = value;
                
                propertyRow.appendChild(keyElem);
                propertyRow.appendChild(valueElem);
                propertiesContainer.appendChild(propertyRow);
            }
        }
        
        // Setup action buttons
        document.getElementById('view-documents').onclick = function() {
            if (properties.PARCEL_NUM) {
                window.location.href = `/documents?parcel=${properties.PARCEL_NUM}`;
            }
        };
        
        document.getElementById('view-workflows').onclick = function() {
            if (properties.PARCEL_NUM) {
                window.location.href = `/workflows?parcel=${properties.PARCEL_NUM}`;
            }
        };
        
        // Show the info panel if it's not already visible
        document.getElementById('feature-info').classList.add('active');
    });
    
    // Close the feature info panel when the close button is clicked
    document.getElementById('close-feature-info').addEventListener('click', function() {
        document.getElementById('feature-info').classList.remove('active');
    });
</script>
{% endblock %}
