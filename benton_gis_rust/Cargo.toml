[package]
name = "benton_gis_rust"
version = "0.1.0"
edition = "2021"
description = "GIS workflow solution for Benton County Assessor's Office"
authors = ["Benton County"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Basic web framework
actix-web = "4.0.1"
actix-files = "0.6.0"
actix-cors = "0.6.1"

# Serialization/Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Logging
env_logger = "0.9.0"
log = "0.4.14"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15.0"
