[package]
name = "benton_gis"
version = "0.1.0"
edition = "2021"
description = "Benton County GIS Platform"
authors = ["Benton County"]

[dependencies]
# Web server
actix-web = "4.4"
actix-files = "0.6"
actix-cors = "0.6"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "json", "macros"] }
rusqlite = { version = "0.29", features = ["bundled"] }

# Templating
askama = "0.12"
askama_actix = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for external APIs
reqwest = { version = "0.11", features = ["json"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Utilities
log = "0.4"
env_logger = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.4", features = ["v4", "serde"] }
dotenv = "0.15"

[build-dependencies]
askama = "0.12"