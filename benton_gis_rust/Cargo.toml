[package]
name = "benton_gis_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
aci-dev = "1.0.0"
actix-web = "4.3.1" # Will be replaced by ACI.dev
actix-files = "0.6.2" # Will be replaced by ACI.dev equivalent
askama = "0.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.10"
log = "0.4"
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.29", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"