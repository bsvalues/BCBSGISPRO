[package]
name = "benton_gis_rust"
version = "0.1.0"
edition = "2018"
description = "GIS workflow solution for Benton County Assessor's Office"
authors = ["Benton County"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Web server
tiny_http = "0.12"

# Serialization/Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "0.8", features = ["v4", "serde"] }
chrono = { version = "0.4.19", features = ["serde"] }
log = "0.4"
simple_logger = "1.11"

# Database
rusqlite = { version = "0.24", features = ["bundled"] }

# Web template engine
askama = "0.10"

# Static files
mime_guess = "2.0"
base64 = "0.13"

[build-dependencies]
askama = "0.10"
