[package]
name = "terrafusion_platform"
version = "0.1.0"
edition = "2021"
description = "TerraFusion Platform for Benton County GIS and Document Management"
authors = ["Benton County"]

[dependencies]
# Web server
tiny_http = "0.12"
mime_guess = "2.0"

# Templating
askama = "0.12"

# Database
rusqlite = { version = "0.29", features = ["bundled"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_qs = "0.12"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Utilities
log = "0.4"
simple_logger = "4.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.4", features = ["v4", "serde"] }
base64 = "0.21"

# Optional features
tokio = { version = "1", features = ["full"] }

[build-dependencies]
askama = "0.12"